name: Cadence successful score5 original exports and captures DATAONLY
on:
  push:
    branches: [cadence-studio/windows-build]
    paths: ['.cadence-studio/gui8-evidence-readback/**', '.github/workflows/cadence-gui8-evidence-readback.yml']
permissions:
  contents: read
  actions: read
jobs:
  read-original-score5:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Read exact native export XML captures and cleanup originals without executing artifact payload
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I .cadence-studio/gui8-evidence-readback/read_gui8.py --output "$RUNNER_TEMP/score5-dataonly"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cadence-score5-dataonly-${{ github.run_id }}
          path: ${{ runner.temp }}/score5-dataonly/readback-receipt.json
          retention-days: 7
          if-no-files-found: warn
