name: Cadence successful native MIDI import originals DATAONLY
on:
  push:
    branches: [cadence-studio/windows-build]
    paths: ['.cadence-studio/gui8-evidence-readback/**', '.github/workflows/cadence-gui8-evidence-readback.yml']
permissions:
  contents: read
  actions: read
jobs:
  read-successful-midi-import-originals:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Read original native XML comparison JSON and two PNGs from successful full MIDI import without executing payload
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I .cadence-studio/gui8-evidence-readback/read_gui8.py --output "$RUNNER_TEMP/successful-midi-import-original-dataonly"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cadence-successful-midi-import-original-dataonly-${{ github.run_id }}
          path: ${{ runner.temp }}/successful-midi-import-original-dataonly/readback-receipt.json
          retention-days: 7
          if-no-files-found: warn
