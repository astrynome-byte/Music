# SPDX-License-Identifier: GPL-3.0-only
name: 'Cadence Studio: exercise the retained local-library UI'
on:
  push:
    branches: ['cadence-studio/windows-build']
    paths:
      - '.cadence-studio/library-ui-probe/**'
      - '.github/workflows/cadence-library-ui-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: cadence-library-ui-probe-${{ github.ref }}
  cancel-in-progress: false
jobs:
  retained-library-ui:
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
        with:
          path: driver
          fetch-depth: 1
          persist-credentials: false

      - name: Use Windows x64 compiler for the independent UI Automation probe
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          vsversion: '2022'
          sdk: '10.0.26100.0'

      - name: Download only the real retained library candidate artifact
        uses: actions/download-artifact@v4
        with:
          artifact-ids: '13755702885'
          run-id: 42793810996
          repository: astrynome-byte/Music
          github-token: ${{ github.token }}
          merge-multiple: true
          path: ${{ runner.temp }}/library-ui-original-stage

      - name: Verify provenance and restore build 1001 without installing Qt or rebuilding Cadence
        run: |
          $resultRoot = "$env:RUNNER_TEMP/library-ui-results"
          if (Test-Path -LiteralPath $resultRoot) { throw 'UI result directory must be new.' }
          New-Item -ItemType Directory -Path $resultRoot | Out-Null
          & "$env:GITHUB_WORKSPACE/driver/.cadence-studio/library-ui-probe/Restore-LibraryStage.ps1" `
            -ArtifactDirectory "$env:RUNNER_TEMP/library-ui-original-stage" `
            -StagePath "$env:RUNNER_TEMP/library-ui-stage" `
            -ResultPath "$resultRoot/stage-restoration.json" *>&1 |
            Tee-Object -FilePath "$resultRoot/restore.log" | Out-Host

      - name: Compile only the UI Automation client from the driver source
        run: |
          $probeSource = "$env:GITHUB_WORKSPACE/driver/.cadence-studio/library-ui-probe/UiaProbe.cpp"
          $probeBuild = "$env:RUNNER_TEMP/library-ui-probe-build"
          if (Test-Path -LiteralPath $probeBuild) { throw 'Probe build directory must be new.' }
          New-Item -ItemType Directory -Path $probeBuild | Out-Null
          Push-Location $probeBuild
          try {
            $previousPreference = $ErrorActionPreference
            $ErrorActionPreference = 'Continue'
            try {
              & cl.exe /nologo /std:c++17 /utf-8 /EHsc $probeSource /Fe:UiaProbe.exe /link ole32.lib oleaut32.lib user32.lib uuid.lib 2>&1 |
                Tee-Object -FilePath (Join-Path $probeBuild 'compile.log') | Out-Host
              $compileStatus = $LASTEXITCODE
            } finally { $ErrorActionPreference = $previousPreference }
            if ($compileStatus -ne 0) { throw "UI Automation probe compilation failed with code $compileStatus." }
          } finally { Pop-Location }

      - name: Exercise only this disposable runner's retained library UI
        run: |
          & "$env:GITHUB_WORKSPACE/driver/.cadence-studio/library-ui-probe/Run-LibraryUiProbe.ps1" `
            -StagePath "$env:RUNNER_TEMP/library-ui-stage" `
            -ProbePath "$env:RUNNER_TEMP/library-ui-probe-build/UiaProbe.exe" `
            -OutputDirectory "$env:RUNNER_TEMP/library-ui-results/ui-probe"

      - name: Print bounded evidence from this exact UI inspection even if it was blocked
        if: always()
        run: |
          $resultRoot = Join-Path $env:RUNNER_TEMP 'library-ui-results'
          $jsonBudget = 1000000L
          $pngBudget = 2000000L
          $jsonPrinted = 0L
          $pngPrinted = 0L
          $notes = [Collections.Generic.List[string]]::new()
          function Write-Evidence([string] $Kind, $Document) {
            Write-Host ('CADENCE_UI_EVIDENCE_' + $Kind + '_BEGIN')
            Write-Host ($Document | ConvertTo-Json -Depth 40 -Compress)
            Write-Host ('CADENCE_UI_EVIDENCE_' + $Kind + '_END')
          }
          if (Test-Path -LiteralPath $resultRoot -PathType Container) {
            $jsonFiles = @(Get-ChildItem -LiteralPath $resultRoot -Recurse -File -Filter '*.json' |
              Where-Object { -not ($_.Attributes -band [IO.FileAttributes]::ReparsePoint) } |
              Sort-Object FullName | Select-Object -First 17)
            if ($jsonFiles.Count -gt 16) { $notes.Add('More than16 JSON files; printing only first16.') }
            foreach ($file in @($jsonFiles | Select-Object -First 16)) {
              if ($file.Length -gt $jsonBudget) { $notes.Add('Oversized JSON excluded: ' + $file.Name); continue }
              try {
                $raw = [IO.File]::ReadAllBytes($file.FullName)
                $document = [Text.Encoding]::UTF8.GetString($raw).TrimStart([char]0xfeff) | ConvertFrom-Json -AsHashtable
                $envelope = [ordered]@{ source_run_id=[long]$env:GITHUB_RUN_ID;path=[IO.Path]::GetRelativePath($resultRoot,$file.FullName).Replace('\','/');bytes=$raw.Length;sha256=[Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($raw)).ToLowerInvariant();report=$document }
                $encoded = $envelope | ConvertTo-Json -Depth 40 -Compress
                $size = [Text.Encoding]::UTF8.GetByteCount($encoded)
                if ($jsonPrinted + $size -gt $jsonBudget) { $notes.Add('JSON aggregate budget reached: ' + $file.Name); continue }
                Write-Evidence 'JSON' $envelope
                $jsonPrinted += $size
              } catch { $notes.Add('Unreadable JSON: ' + $file.Name + ': ' + $_.Exception.Message) }
            }
            $pngFiles = @(Get-ChildItem -LiteralPath $resultRoot -Recurse -File -Filter '*.png' |
              Where-Object { -not ($_.Attributes -band [IO.FileAttributes]::ReparsePoint) } |
              Sort-Object FullName | Select-Object -First 3)
            if ($pngFiles.Count -gt 2) { $notes.Add('More than2 PNG captures; printing only first2.') }
            foreach ($file in @($pngFiles | Select-Object -First 2)) {
              if (4L * [long][Math]::Ceiling($file.Length / 3.0) + $pngPrinted -gt $pngBudget) { $notes.Add('PNG base64 aggregate budget reached: ' + $file.Name); continue }
              $raw = [IO.File]::ReadAllBytes($file.FullName)
              $base64 = [Convert]::ToBase64String($raw)
              Write-Evidence 'PNG' ([ordered]@{ source_run_id=[long]$env:GITHUB_RUN_ID;path=[IO.Path]::GetRelativePath($resultRoot,$file.FullName).Replace('\','/');bytes=$raw.Length;sha256=[Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($raw)).ToLowerInvariant();base64=$base64 })
              $pngPrinted += $base64.Length
            }
          } else { $notes.Add('No result directory exists; UI evidence unavailable.') }
          Write-Evidence 'SUMMARY' ([ordered]@{ schema_version=1;source_run_id=[long]$env:GITHUB_RUN_ID;scope='Read back existing results from this exact workflow only';reader_only=$true;application_executed=$false;ui_validation_inferred_from_reading=$false;json_printed_bytes=$jsonPrinted;png_base64_printed_bytes=$pngPrinted;notes=@($notes.ToArray()) })

      - name: Retain UI reports, tree dumps, captures and logs even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cadence-library-ui-probe-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/library-ui-results/**
            ${{ runner.temp }}/library-ui-probe-build/compile.log
            ${{ runner.temp }}/library-ui-original-stage/stage-manifest.json
            ${{ runner.temp }}/library-ui-original-stage/cadence-build-result.json
            ${{ runner.temp }}/library-ui-original-stage/SHA256SUMS.txt
            ${{ github.workspace }}/driver/.cadence-studio/library-ui-probe/README.md
          retention-days: 14
          if-no-files-found: warn
