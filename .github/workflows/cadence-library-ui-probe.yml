# SPDX-License-Identifier: GPL-3.0-only
name: 'Cadence Studio: exercise the retained local-library UI'
on:
  push:
    branches: ['cadence-studio/windows-build']
    paths:
      - '.cadence-studio/library-ui-probe/**'
      - '.github/workflows/cadence-library-ui-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: cadence-library-ui-probe-${{ github.ref }}
  cancel-in-progress: false
jobs:
  retained-library-ui:
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
        with:
          path: driver
          fetch-depth: 1
          persist-credentials: false

      - name: Use Windows x64 compiler for the independent UI Automation probe
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          vsversion: '2022'
          sdk: '10.0.26100.0'

      - name: Download only the real retained library candidate artifact
        uses: actions/download-artifact@v4
        with:
          artifact-ids: '13755702885'
          run-id: 42793810996
          repository: astrynome-byte/Music
          github-token: ${{ github.token }}
          merge-multiple: true
          path: ${{ runner.temp }}/library-ui-original-stage

      - name: Verify provenance and restore build 1001 without installing Qt or rebuilding Cadence
        run: |
          $resultRoot = "$env:RUNNER_TEMP/library-ui-results"
          if (Test-Path -LiteralPath $resultRoot) { throw 'UI result directory must be new.' }
          New-Item -ItemType Directory -Path $resultRoot | Out-Null
          & "$env:GITHUB_WORKSPACE/driver/.cadence-studio/library-ui-probe/Restore-LibraryStage.ps1" `
            -ArtifactDirectory "$env:RUNNER_TEMP/library-ui-original-stage" `
            -StagePath "$env:RUNNER_TEMP/library-ui-stage" `
            -ResultPath "$resultRoot/stage-restoration.json" *>&1 |
            Tee-Object -FilePath "$resultRoot/restore.log" | Out-Host

      - name: Compile only the UI Automation client from the driver source
        run: |
          $probeSource = "$env:GITHUB_WORKSPACE/driver/.cadence-studio/library-ui-probe/UiaProbe.cpp"
          $probeBuild = "$env:RUNNER_TEMP/library-ui-probe-build"
          if (Test-Path -LiteralPath $probeBuild) { throw 'Probe build directory must be new.' }
          New-Item -ItemType Directory -Path $probeBuild | Out-Null
          Push-Location $probeBuild
          try {
            $previousPreference = $ErrorActionPreference
            $ErrorActionPreference = 'Continue'
            try {
              & cl.exe /nologo /std:c++17 /utf-8 /EHsc $probeSource /Fe:UiaProbe.exe /link ole32.lib oleaut32.lib user32.lib uuid.lib 2>&1 |
                Tee-Object -FilePath (Join-Path $probeBuild 'compile.log') | Out-Host
              $compileStatus = $LASTEXITCODE
            } finally { $ErrorActionPreference = $previousPreference }
            if ($compileStatus -ne 0) { throw "UI Automation probe compilation failed with code $compileStatus." }
          } finally { Pop-Location }

      - name: Exercise only this disposable runner's retained library UI
        run: |
          & "$env:GITHUB_WORKSPACE/driver/.cadence-studio/library-ui-probe/Run-LibraryUiProbe.ps1" `
            -StagePath "$env:RUNNER_TEMP/library-ui-stage" `
            -ProbePath "$env:RUNNER_TEMP/library-ui-probe-build/UiaProbe.exe" `
            -OutputDirectory "$env:RUNNER_TEMP/library-ui-results/ui-probe"

      - name: Retain UI reports, tree dumps, captures and logs even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cadence-library-ui-probe-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/library-ui-results/**
            ${{ runner.temp }}/library-ui-probe-build/compile.log
            ${{ runner.temp }}/library-ui-original-stage/stage-manifest.json
            ${{ runner.temp }}/library-ui-original-stage/cadence-build-result.json
            ${{ runner.temp }}/library-ui-original-stage/SHA256SUMS.txt
            ${{ github.workspace }}/driver/.cadence-studio/library-ui-probe/README.md
          retention-days: 14
          if-no-files-found: warn
