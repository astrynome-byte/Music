name: 'Cadence: second synthetic native password entry qualification'
on:
  push:
    branches: [cadence-studio/windows-build]
    paths: [.cadence-studio/secret-entry-qa-v2/target.json]
permissions:
  contents: read
jobs:
  synthetic-password-entry-only:
    if: github.repository == 'astrynome-byte/Music'
    runs-on: windows-2022
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Require reviewed synthetic-only activation and exact helper bytes
        run: |
          $ErrorActionPreference='Stop'
          $helper="$env:GITHUB_WORKSPACE/.cadence-studio/secret-entry-qa-v2"
          $target=Get-Content -LiteralPath "$helper/target.json" -Raw -Encoding utf8|ConvertFrom-Json
          if($target.schema_version-ne1-or$target.observation_attempt-ne2-or$target.previous_failed_run_id-ne43337069937-or$target.ready-isnot[bool]-or-not$target.ready-or
             $target.synthetic_only-isnot[bool]-or-not$target.synthetic_only-or
             $target.real_token_used-isnot[bool]-or$target.real_token_used-or
             $target.Cadence_application_executed-isnot[bool]-or$target.Cadence_application_executed-or
             $target.server_started-isnot[bool]-or$target.server_started){throw 'Only reviewed synthetic native helper qualification may run.'}
          $manifest="$helper/helper-manifest.json"
          if($target.helper_manifest_sha256-cnotmatch'^[a-f0-9]{64}$'-or(Get-FileHash -LiteralPath $manifest -Algorithm SHA256).Hash.ToLowerInvariant()-cne$target.helper_manifest_sha256){throw 'Exact reviewed helper manifest required.'}
          $inventory=Get-Content -LiteralPath $manifest -Raw -Encoding utf8|ConvertFrom-Json
          if($inventory.schema_version-ne1-or@($inventory.files).Count-ne5){throw 'Exact five-input helper inventory required.'}
          $expectedPaths=@('.cadence-studio/secret-entry-qa-v2/native/OwnedSecretEntry.h','.cadence-studio/secret-entry-qa-v2/native/OwnedSecretEntryHarness.cpp','.cadence-studio/secret-entry-qa-v2/Run-SyntheticSecretEntry.ps1','.cadence-studio/import-dialogs-gui-2008/native/OwnedKeyboard.h','.cadence-studio/import-dialogs-gui-2008/OwnProcessJob.psm1')
          [string[]]$actualPaths=@($inventory.files|ForEach-Object path)
          [Array]::Sort($actualPaths,[StringComparer]::Ordinal);[Array]::Sort($expectedPaths,[StringComparer]::Ordinal)
          for($i=0;$i-lt5;$i++){if($actualPaths[$i]-cne$expectedPaths[$i]){throw 'Duplicated or omitted helper input.'}}
          foreach($entry in $inventory.files){
            if(($entry.bytes-isnot[int]-and$entry.bytes-isnot[long])-or$entry.bytes-lt1-or$entry.sha256-cnotmatch'^[a-f0-9]{64}$'){throw 'Exact helper byte count and SHA required.'}
            if($entry.path-cnotmatch'^(?:\.cadence-studio/secret-entry-qa-v2/(?:native/OwnedSecretEntry\.h|native/OwnedSecretEntryHarness\.cpp|Run-SyntheticSecretEntry\.ps1)|\.cadence-studio/import-dialogs-gui-2008/(?:native/OwnedKeyboard\.h|OwnProcessJob\.psm1))$'){throw 'Unexpected helper inventory path.'}
            $path=Join-Path $env:GITHUB_WORKSPACE $entry.path
            if((Get-Item -LiteralPath $path).Length-ne$entry.bytes-or(Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()-cne$entry.sha256){throw 'Reviewed helper bytes changed.'}
          }
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          sdk: 10.0.26100.0
      - name: Compile only the native synthetic harness
        run: |
          $ErrorActionPreference='Stop'
          $helper="$env:GITHUB_WORKSPACE/.cadence-studio/secret-entry-qa-v2"
          $out="$env:RUNNER_TEMP/cadence-secret-synthetic-v2-build"
          if(Test-Path -LiteralPath $out){throw 'Use a fresh native helper build directory.'}
          [void][IO.Directory]::CreateDirectory($out)
          & cl.exe /nologo /std:c++17 /EHsc /W4 /utf-8 /MT /DUNICODE /D_UNICODE `
            "/I$helper/native" "/I$env:GITHUB_WORKSPACE/.cadence-studio/import-dialogs-gui-2008/native" `
            "$helper/native/OwnedSecretEntryHarness.cpp" "/Fo$out/OwnedSecretEntryHarness.obj" `
            "/Fe$out/OwnedSecretEntryHarness.exe" /link user32.lib ole32.lib oleaut32.lib advapi32.lib uiautomationcore.lib 2>&1 |
            Tee-Object -FilePath "$out/compile.original.log"
          if($LASTEXITCODE-ne0){throw 'Synthetic native helper compilation failed.'}
      - name: Execute twelve synthetic native cases and verify owned clean exit
        run: |
          $helper="$env:GITHUB_WORKSPACE/.cadence-studio/secret-entry-qa-v2"
          & "$helper/Run-SyntheticSecretEntry.ps1" `
            -HarnessPath "$env:RUNNER_TEMP/cadence-secret-synthetic-v2-build/OwnedSecretEntryHarness.exe" `
            -JobModulePath "$env:GITHUB_WORKSPACE/.cadence-studio/import-dialogs-gui-2008/OwnProcessJob.psm1" `
            -OutputDirectory "$env:RUNNER_TEMP/cadence-secret-synthetic-v2-evidence"
      - name: Retain exact synthetic result and compilation output even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cadence-secret-entry-synthetic-v2-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/cadence-secret-synthetic-v2-build/compile.original.log
            ${{ runner.temp }}/cadence-secret-synthetic-v2-evidence/**
          retention-days: 14
          if-no-files-found: warn
