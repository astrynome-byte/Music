name: Cadence QA Clock original native evidence reader
on:
  workflow_dispatch:
  push:
    branches: [cadence-studio/windows-build]
    paths:
      - '.cadence-studio/asio-qa-phase2/Read-EndpointEvidence.py'
      - '.github/workflows/cadence-asio-qa-clock-readback.yml'
permissions:
  contents: read
  actions: read
jobs:
  original-data-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: astrynome-byte/Music
          run-id: '43212261044'
          name: cadence-qa-clock-direct-43212261044-1
          path: ${{ runner.temp }}/qa-clock-original
      - name: Read four original scenarios, binary hashes and corresponding source only
        shell: bash
        run: |
          python3 -I .cadence-studio/asio-qa-phase2/Read-EndpointEvidence.py \
            --root "$RUNNER_TEMP/qa-clock-original" \
            --output "$RUNNER_TEMP/qa-clock-readback/original-evidence.json"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cadence-qa-clock-readback-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/qa-clock-readback
          if-no-files-found: warn
          retention-days: 14
