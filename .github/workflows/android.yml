name: Android
on:
  pull_request:
  push:
    branches: [main, 'codex/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build, test Android screens and run lint
        run: ./gradlew assembleDebug testDebugUnitTest lintDebug --no-daemon
      - name: Upload installable debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Music-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Music-validation-reports
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 14
