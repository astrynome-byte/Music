# SPDX-License-Identifier: GPL-3.0-only
name: 'Cadence Studio: real owned sfizz VST3 and VSCO CC0 qualification'
on:
  push:
    branches: ['cadence-studio/windows-build']
    paths:
      - '.cadence-studio/vsco-sfizz-qa/**'
      - '.github/workflows/cadence-vsco-sfizz-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: cadence-vsco-sfizz-qa-${{ github.ref }}
  cancel-in-progress: false
jobs:
  real-sfz-reader:
    runs-on: windows-2022
    timeout-minutes: 18
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
        with:
          path: driver
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Select only the existing MSVC2022 x64 tools for the small metadata-only debugger
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          vsversion: '2022'
          sdk: '10.0.26100.0'
      - name: Compile the reviewed owned-child debugger without rebuilding Cadence
        run: |
          & "$env:GITHUB_WORKSPACE/driver/.cadence-studio/vsco-sfizz-qa/debugger/Build-OwnedExportDebugger.ps1" `
            -SourcePath "$env:GITHUB_WORKSPACE/driver/.cadence-studio/vsco-sfizz-qa/debugger/OwnedExportDebugEvents.cpp" `
            -OutputDirectory "$env:RUNNER_TEMP/sfz-debugger-build"
      - name: Download only the immutable already compiled combined2002 stage
        uses: actions/download-artifact@v4
        with:
          artifact-ids: '13898607081'
          merge-multiple: true
          run-id: 43108867145
          repository: astrynome-byte/Music
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/sfz-original-stage
      - name: Authenticate the retained executable and full source/stage provenance
        run: |
          & "$env:GITHUB_WORKSPACE/driver/.cadence-studio/vsco-sfizz-qa/Restore-CombinedStage.ps1" `
            -ArtifactDirectory "$env:RUNNER_TEMP/sfz-original-stage" `
            -StagePath "$env:RUNNER_TEMP/sfz-stage" `
            -ResultPath "$env:RUNNER_TEMP/sfz-restoration.json"
      - name: Download pinned sfizz and data-extract only the owned reader, without running its global installer
        run: |
          python -I -X utf8 "$env:GITHUB_WORKSPACE/driver/.cadence-studio/vsco-sfizz-qa/Prepare-SfzAssets.py" `
            --mode reader --root "$env:RUNNER_TEMP/sfz-owned-assets"
          if ($LASTEXITCODE -ne 0) { throw 'Exact native reader preparation failed.' }
      - name: Require the real Cadence VST3 scan before downloading any CC0 samples
        run: |
          python -I -X utf8 "$env:GITHUB_WORKSPACE/driver/.cadence-studio/vsco-sfizz-qa/Test-SfzHost.py" `
            --phase scan --stage "$env:RUNNER_TEMP/sfz-stage" `
            --assets "$env:RUNNER_TEMP/sfz-owned-assets" --output "$env:RUNNER_TEMP/sfz-results"
          if ($LASTEXITCODE -ne 0) { throw 'Actual native reader scan failed; SFZ rendering remains unqualified.' }
      - name: Download only the fixed 99.5MB CC0 flute and violin source selection
        run: |
          python -I -X utf8 "$env:GITHUB_WORKSPACE/driver/.cadence-studio/vsco-sfizz-qa/Prepare-SfzAssets.py" `
            --mode samples --root "$env:RUNNER_TEMP/sfz-owned-assets"
          if ($LASTEXITCODE -ne 0) { throw 'Pinned CC0 subset preparation failed.' }
      - name: Require native VST3 state restoration, real SFZ gain response and save-only persistence
        run: |
          python -I -X utf8 "$env:GITHUB_WORKSPACE/driver/.cadence-studio/vsco-sfizz-qa/Test-SfzHost.py" `
            --phase render --debug-export-tool "$env:RUNNER_TEMP/sfz-debugger-build/OwnedExportDebugEvents.exe" `
            --stage "$env:RUNNER_TEMP/sfz-stage" `
            --assets "$env:RUNNER_TEMP/sfz-owned-assets" --output "$env:RUNNER_TEMP/sfz-results"
          if ($LASTEXITCODE -ne 0) { throw 'Actual SFZ host or controlled gain proof failed.' }
      - name: Print bounded reports and actual native logs even after failure
        if: always()
        run: |
          $budget=393216L
          foreach($root in @("$env:RUNNER_TEMP/sfz-debugger-build","$env:RUNNER_TEMP/sfz-owned-assets","$env:RUNNER_TEMP/sfz-results")) {
            if(-not(Test-Path -LiteralPath $root -PathType Container)){continue}
            $files=@(Get-ChildItem -LiteralPath $root -File|Where-Object{$_.Extension -in @('.json','.jsonl') -or $_.Name -match '\.(stdout|stderr|cadence-log)\.(txt|log)$'}|Sort-Object Name)
            foreach($file in $files) {
              if($budget -le 0){break};$limit=[Math]::Min(65536L,$budget)
              $stream=[IO.File]::OpenRead($file.FullName)
              try{[void]$stream.Seek([Math]::Max(0L,$stream.Length-$limit),[IO.SeekOrigin]::Begin);$bytes=[byte[]]::new([int][Math]::Min($limit,$stream.Length));$count=$stream.Read($bytes,0,$bytes.Length);$text=[Text.Encoding]::UTF8.GetString($bytes,0,$count)}finally{$stream.Dispose()}
              Write-Host 'CADENCE_SFZ_EVIDENCE_BEGIN'
              Write-Host ([ordered]@{file=$file.Name;file_bytes=$file.Length;printed_bytes=$count;tail_only=$file.Length -gt $count;text=$text}|ConvertTo-Json -Depth 4 -Compress)
              Write-Host 'CADENCE_SFZ_EVIDENCE_END';$budget-=$count
            }
          }
      - name: Retain reports and authorized controlled outputs, excluding downloaded plugins and sample libraries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cadence-vsco-sfizz-qa-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/sfz-debugger-build/debugger-build-report.json
            ${{ runner.temp }}/sfz-debugger-build/compiler.stdout.log
            ${{ runner.temp }}/sfz-debugger-build/compiler.stderr.log
            ${{ runner.temp }}/sfz-restoration.json
            ${{ runner.temp }}/sfz-results/**
            ${{ runner.temp }}/sfz-owned-assets/reader-assets.json
            ${{ runner.temp }}/sfz-owned-assets/sample-assets.json
            ${{ runner.temp }}/sfz-owned-assets/extractor.stdout.log
            ${{ runner.temp }}/sfz-owned-assets/extractor.stderr.log
            ${{ github.workspace }}/driver/.cadence-studio/vsco-sfizz-qa/source-manifest.json
            ${{ github.workspace }}/driver/.cadence-studio/vsco-sfizz-qa/asset-source-manifest.json
            ${{ github.workspace }}/driver/.cadence-studio/vsco-sfizz-qa/sfizz-reader-lock.json
            ${{ github.workspace }}/driver/.cadence-studio/vsco-sfizz-qa/fixtures/LICENSE.txt
            ${{ github.workspace }}/driver/.cadence-studio/vsco-sfizz-qa/VSCO-CC0-LICENSE.txt
          retention-days: 14
          include-hidden-files: true
          if-no-files-found: warn
