# SPDX-License-Identifier: GPL-3.0-only
name: 'Cadence Studio: isolated Windows store regression'
on:
  push:
    branches: ['cadence-studio/windows-build']
    paths:
      - '.cadence-studio/library-store-probe/**'
      - '.github/workflows/cadence-library-store-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: cadence-library-store-probe-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows-qtcore-store:
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
        with:
          path: driver
          fetch-depth: 1
          persist-credentials: false

      - name: Download only the failed UI run's retained logs for read-only diagnosis
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          artifact-ids: '13902286323'
          run-id: 43123741624
          repository: astrynome-byte/Music
          github-token: ${{ github.token }}
          merge-multiple: true
          path: ${{ runner.temp }}/library-store-diagnostic-11

      - name: Print at most four known diagnostic log tails from that artifact
        if: always()
        continue-on-error: true
        run: |
          $root=Join-Path $env:RUNNER_TEMP 'library-store-diagnostic-11'
          $notes=[Collections.Generic.List[string]]::new()
          $read=@()
          foreach($name in @('application.stdout.log','application.stderr.log','probe.stdout.log','probe.stderr.log')) {
            $matches=@(Get-ChildItem -LiteralPath $root -Recurse -File -Filter $name -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -ceq $name -and -not ($_.Attributes -band [IO.FileAttributes]::ReparsePoint) } | Select-Object -First 2)
            if($matches.Count -ne 1){$notes.Add('Expected exactly one '+$name+'; no arbitrary file chosen.');continue}
            $file=$matches[0]
            $stream=[IO.File]::Open($file.FullName,[IO.FileMode]::Open,[IO.FileAccess]::Read,[IO.FileShare]::Read)
            try {
              [void]$stream.Seek([Math]::Max(0L,$stream.Length-16384L),[IO.SeekOrigin]::Begin)
              $bytes=[byte[]]::new([int][Math]::Min(16384L,$stream.Length))
              $count=$stream.Read($bytes,0,$bytes.Length)
              $text=[Text.Encoding]::UTF8.GetString($bytes,0,$count)
            } finally {$stream.Dispose()}
            $document=[ordered]@{source_run_id=43123741624;source_artifact_id=13902286323;path=[IO.Path]::GetRelativePath($root,$file.FullName);file_bytes=$file.Length;tail_bytes=$count;tail_only=$file.Length -gt $count;text=$text;reader_only=$true;application_executed=$false}
            Write-Host 'CADENCE_STORE_DIAGNOSTIC_LOG_BEGIN'
            Write-Host ($document|ConvertTo-Json -Depth 5 -Compress)
            Write-Host 'CADENCE_STORE_DIAGNOSTIC_LOG_END'
            $read += [ordered]@{name=$name;tail_bytes=$count}
          }
          $summary=[ordered]@{schema_version=1;source_run_id=43123741624;source_artifact_id=13902286323;reader_only=$true;application_executed=$false;files_read=$read;notes=@($notes.ToArray())}
          $summary|ConvertTo-Json -Depth 5|Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'library-store-diagnostic-summary.json') -Encoding utf8

      - name: Use only the native MSVC2022 x64 development toolchain
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          vsversion: '2022'
          sdk: '10.0.26100.0'

      - name: Install or restore only the Qt base development kit
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.2'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          archives: 'qtbase'
          cache: true
          cache-key-prefix: 'cadence-qtbase-store-probe'

      - name: Verify exact source hashes and run only the nine QtCore storage/XML scenarios
        run: |
          & "$env:GITHUB_WORKSPACE/driver/.cadence-studio/library-store-probe/Run-StoreProbe.ps1" `
            -SourcePath "$env:GITHUB_WORKSPACE/driver/.cadence-studio/library-store-probe" `
            -QtPath $env:QT_ROOT_DIR `
            -OutputDirectory "$env:RUNNER_TEMP/library-store-probe-results"

      - name: Print bounded source/runtime evidence and logs even after failure
        if: always()
        run: |
          $root=Join-Path $env:RUNNER_TEMP 'library-store-probe-results'
          $budget=262144L
          if(Test-Path -LiteralPath $root -PathType Container){
            $files=@(Get-ChildItem -LiteralPath $root -File | Where-Object { -not ($_.Attributes -band [IO.FileAttributes]::ReparsePoint) -and $_.Extension -in @('.json','.log') } |
              Sort-Object @{Expression={if($_.Extension -eq '.json'){0}else{1}}},Name | Select-Object -First 20)
            foreach($file in $files){
              $limit=[Math]::Min(32768L,$budget)
              if($limit -le 0){break}
              $stream=[IO.File]::OpenRead($file.FullName)
              try{
                [void]$stream.Seek([Math]::Max(0L,$stream.Length-$limit),[IO.SeekOrigin]::Begin)
                $bytes=[byte[]]::new([int][Math]::Min($limit,$stream.Length));$count=$stream.Read($bytes,0,$bytes.Length)
                $text=[Text.Encoding]::UTF8.GetString($bytes,0,$count)
              }finally{$stream.Dispose()}
              Write-Host 'CADENCE_STORE_PROBE_EVIDENCE_BEGIN'
              Write-Host ([ordered]@{path=$file.Name;file_bytes=$file.Length;printed_bytes=$count;tail_only=$file.Length -gt $count;text=$text}|ConvertTo-Json -Depth 4 -Compress)
              Write-Host 'CADENCE_STORE_PROBE_EVIDENCE_END'
              $budget-=$count
            }
          }else{Write-Host 'Store probe did not create results; no runtime success inferred.'}

      - name: Retain source verification, compiler/runtime logs and diagnostic summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cadence-library-store-probe-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/library-store-probe-results/**
            ${{ runner.temp }}/library-store-diagnostic-summary.json
          retention-days: 14
          if-no-files-found: warn
