name: Cadence existing Microsoft and ASIO diagnostics data readback
on:
  workflow_dispatch:
  push:
    branches: [cadence-studio/windows-build]
    paths:
      - '.cadence-studio/full2005-provenance/diagnostic-readback/**'
      - '.github/workflows/cadence-diagnostic-artifact-readback.yml'
permissions:
  contents: read
  actions: read
jobs:
  existing-data-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify exact producer artifact API identities before downloading
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const owner = 'astrynome-byte', repo = 'Music';
            const head = 'f46d6bf3777a4153979fd075cc7cc8a7bf4d1818';
            const pins = {
              microsoft: {id:13948435202,run_id:43224732688,name:'cadence-full2005-named-redist-origins-43224732688-1',size_in_bytes:173115,digest:'sha256:b06559b0b66270da1013e03022395b835287f977545099c2a4838aa2461d1b76'},
              asio: {id:13948201375,run_id:43224732699,name:'cadence-asio-phase2-43224732699-1',size_in_bytes:4141794,digest:'sha256:ed9e13ad987644ddca4f091a04eac2a47bceb6176e6b891f29bcd62e16996471'}
            };
            const evidence = {};
            for (const [area,pin] of Object.entries(pins)) {
              const artifact = (await github.rest.actions.getArtifact({owner,repo,artifact_id:pin.id})).data;
              const run = (await github.rest.actions.getWorkflowRun({owner,repo,run_id:pin.run_id})).data;
              if (artifact.id!==pin.id || artifact.name!==pin.name || artifact.size_in_bytes!==pin.size_in_bytes ||
                  artifact.digest!==pin.digest || artifact.expired!==false || artifact.workflow_run?.id!==pin.run_id ||
                  artifact.workflow_run?.head_sha!==head || run.id!==pin.run_id || run.head_sha!==head || run.status!=='completed') {
                throw new Error('Exact producer artifact/run identity mismatch: '+area);
              }
              evidence[area] = {...pin,head_sha:head,expired:false,run_status:run.status,run_conclusion:run.conclusion};
            }
            const root = path.join(process.env.RUNNER_TEMP,'cadence-existing-diagnostic-inputs');
            fs.mkdirSync(root,{recursive:false});
            fs.writeFileSync(path.join(root,'verified-api-metadata.json'),JSON.stringify(evidence)+'\n',{flag:'wx'});
      - name: Download only the exact small Microsoft evidence artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: astrynome-byte/Music
          run-id: '43224732688'
          artifact-ids: '13948435202'
          merge-multiple: true
          path: ${{ runner.temp }}/cadence-existing-diagnostic-inputs/microsoft
      - name: Download only the exact existing ASIO evidence artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: astrynome-byte/Music
          run-id: '43224732699'
          artifact-ids: '13948201375'
          merge-multiple: true
          path: ${{ runner.temp }}/cadence-existing-diagnostic-inputs/asio
      - name: Read original current SDK terms and failed GUI diagnostics as data only
        shell: bash
        run: |
          python3 -I .cadence-studio/full2005-provenance/diagnostic-readback/read_diagnostic_artifacts.py \
            --microsoft "$RUNNER_TEMP/cadence-existing-diagnostic-inputs/microsoft" \
            --asio "$RUNNER_TEMP/cadence-existing-diagnostic-inputs/asio" \
            --metadata "$RUNNER_TEMP/cadence-existing-diagnostic-inputs/verified-api-metadata.json" \
            --output "$RUNNER_TEMP/cadence-diagnostic-data-readback"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cadence-diagnostic-data-readback-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cadence-diagnostic-data-readback/
          if-no-files-found: error
          retention-days: 14
