# SPDX-License-Identifier: GPL-3.0-only
name: 'Cadence Studio: same GUI project missing-resource retention'
on:
  push:
    branches: ['cadence-studio/windows-build']
    paths:
      - '.cadence-studio/missing-resource-retention-next/**'
      - '.github/workflows/cadence-resource-retention.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: cadence-resource-retention-${{ github.ref }}
  cancel-in-progress: false
jobs:
  retained2002-same-gui-project:
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
        with:
          path: driver
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Retrieve only the pinned original compiled stage
        uses: actions/download-artifact@v4
        with:
          repository: astrynome-byte/Music
          run-id: '43108867145'
          artifact-ids: '13898607081'
          merge-multiple: true
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/retention-original-stage
      - name: Authenticate source, all root members and exact executable before restoring
        run: |
          & "$env:GITHUB_WORKSPACE/driver/.cadence-studio/missing-resource-retention-next/Restore-CombinedStage.ps1" `
            -ArtifactDirectory "$env:RUNNER_TEMP/retention-original-stage" `
            -StagePath "$env:RUNNER_TEMP/retention-stage" `
            -ResultPath "$env:RUNNER_TEMP/retention-restoration.json"
      - name: Run own notation hooks in real GUI; render and natively save each same project
        run: |
          python -I -X utf8 "$env:GITHUB_WORKSPACE/driver/.cadence-studio/missing-resource-retention-next/Run-Retention.py" `
            --stage "$env:RUNNER_TEMP/retention-stage" `
            --restoration-record "$env:RUNNER_TEMP/retention-restoration.json" `
            --output "$env:RUNNER_TEMP/retention-results"
          if ($LASTEXITCODE -ne 0) { throw 'Same-project preservation failed or was blocked; inspect the real report before attributing a product defect' }
      - name: Retain all actual inputs, saved copies, audio, hook logs and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cadence-resource-retention-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/retention-restoration.json
            ${{ runner.temp }}/retention-results/
          retention-days: 14
          include-hidden-files: true
          if-no-files-found: warn
