name: Cadence existing SF2 Windows WAV pitch DATAONLY
on:
  workflow_dispatch:
  push:
    branches: [cadence-studio/windows-build]
    paths:
      - '.cadence-studio/vsco-sf2-pitch/**'
      - '.github/workflows/cadence-vsco-sf2-pitch.yml'
permissions:
  contents: read
  actions: read
jobs:
  existing-WAVs-data-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify exact successful source run and artifact API identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -I .cadence-studio/vsco-sf2-pitch/analyze_existing_wavs.py --metadata-only --output "$RUNNER_TEMP/sf2-pitch-metadata.json"
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: astrynome-byte/Music
          run-id: '43231480145'
          artifact-ids: '13949852671'
          merge-multiple: true
          path: ${{ runner.temp }}/sf2-existing-Windows-WAV-evidence
      - name: Read exact MusicXML and float32 WAV bytes, estimate musical pitch without running the app
        run: python -I .cadence-studio/vsco-sf2-pitch/analyze_existing_wavs.py --input "$RUNNER_TEMP/sf2-existing-Windows-WAV-evidence" --metadata "$RUNNER_TEMP/sf2-pitch-metadata.json" --output "$RUNNER_TEMP/sf2-pitch-analysis.json"
      - name: Retain only numeric pitch analysis and metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cadence-existing-sf2-pitch-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/sf2-pitch-analysis.json
            ${{ runner.temp }}/sf2-pitch-metadata.json
          if-no-files-found: warn
          retention-days: 14
