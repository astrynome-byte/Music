name: Cadence failed GUI2 original evidence DATAONLY
on:
  push:
    branches: [cadence-studio/windows-build]
    paths: ['.cadence-studio/gui2-evidence-readback/**', '.github/workflows/cadence-gui2-evidence-readback.yml']
permissions:
  contents: read
  actions: read
jobs:
  read-original-gui2:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Read only hash-pinned344KB failed GUI2 evidence; never execute its payload
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I .cadence-studio/gui2-evidence-readback/read_gui2.py --output "$RUNNER_TEMP/gui2-dataonly"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cadence-GUI2-dataonly-${{ github.run_id }}
          path: ${{ runner.temp }}/gui2-dataonly/readback-receipt.json
          retention-days: 7
          if-no-files-found: warn
